name: Refresh budget data

# Daily: check MEF for new publications (a few HEAD requests when nothing changed),
# ingest them into the lake (Hugging Face dataset), rebuild the site and deploy it to
# GitHub Pages. In 2026 MEF published between 20:00 and 21:40 UTC, so the evening run
# picks up a publication the same day.
#
# Setup (once): repo variable HF_DATASET (e.g. "usuario/presupuesto-abierto-peru"),
# repo secret HF_TOKEN (Hugging Face write token), Settings > Pages > Source: GitHub Actions.
on:
  schedule:
    - cron: "30 23 * * *"   # 18:30 Lima
  push:
    branches: [main]
    paths: ["pipeline/**", "apps/web/**", ".github/workflows/refresh-data.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and redeploy the site even if MEF published nothing new"
        type: boolean
        default: true
      years:
        description: "Years to check, space-separated (default: current and previous)"
        required: false

concurrency:
  group: refresh-data
  cancel-in-progress: false   # never interrupt an ingest halfway

permissions:
  contents: write   # commit status/mef-publicaciones.json when MEF publishes (see below)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300      # MEF throttles: ~6 MB/s in chunks, far slower when it misbehaves
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      HF_DATASET: ${{ vars.HF_DATASET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements-dev.txt

      - name: Pipeline tests (before touching any data)
        run: python -m pytest pipeline/tests -q

      - name: Update data (check MEF, ingest new publications, push to Hugging Face, rebuild serving)
        id: update
        working-directory: pipeline
        env:
          YEARS: ${{ inputs.years }}
        run: python run.py update $([ "$FORCE" = true ] && echo --force) ${YEARS:+--years $YEARS}

      - name: Decide whether to deploy
        id: plan
        run: |
          if [ "${{ steps.update.outputs.changed }}" = true ] || [ "$FORCE" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # A small commit per MEF publication: a public log of what was ingested, and repo
      # activity that keeps GitHub from disabling this schedule after 60 idle days.
      - name: Record MEF publications in the repo
        if: steps.update.outputs.changed == 'true'
        continue-on-error: true
        run: |
          mkdir -p status
          cp data/lake/manifest.json status/mef-publicaciones.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/mef-publicaciones.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos: nueva publicación del MEF"
            git pull --rebase && git push
          fi

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.deploy == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Build site
        if: steps.plan.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: apps/web/out

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
