name: Refresh budget data

# Daily: check MEF for new publications, ingest the current year's (MEF re-stamps its 8-10 GB
# *-Diario file every day), rebuild the site and deploy it to GitHub Pages: the site is never more
# than a day behind MEF. One publication a week is kept for good as a snapshot (the budget's
# history, pipeline/config.py SNAPSHOT_DIAS); the daily ones only refresh the latest file, so the
# Hugging Face dataset grows weekly. The previous year is downloaded monthly (CADENCIA_DIAS). SEACE
# contracts and purchase orders (OECE) and investment projects (MEF) refresh weekly in the same step;
# if a source is down, the site keeps the last copy on Hugging Face.
#
# Setup (once): HF_DATASET (repo variable or secret, e.g. "usuario/presupuesto-abierto-peru"),
# repo secret HF_TOKEN (Hugging Face write token), Settings > Pages > Source: GitHub Actions.
# Optional: secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID to post a digest of each new publication,
# and variable TELEGRAM_CANAL_URL (e.g. https://t.me/presupuestoabierto) to link the channel on the site.
on:
  schedule:
    - cron: "30 23 * * *"   # 18:30 Lima
  push:
    branches: [main]
    paths: ["pipeline/**", "apps/web/**", ".github/workflows/refresh-data.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and redeploy the site even if MEF published nothing new"
        type: boolean
        default: true
      years:
        description: "Years to check, space-separated (default: current and previous)"
        required: false
      ignore_cadence:
        description: "Download re-published MEF files now, even if ingested within the last 7/30 days"
        type: boolean
        default: false

concurrency:
  group: refresh-data
  cancel-in-progress: false   # never interrupt an ingest halfway

permissions:
  contents: write   # commit status/mef-publicaciones.json when MEF publishes (see below)

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A daily ingest takes ~30-45 min (one 8-10 GB file at ~8 MB/s); the cap bounds what a misbehaving
    # MEF server can burn. Public repo: GitHub-hosted runners are free (~1,300 min/month). If the repo
    # ever becomes private, set CADENCIA_DIAS back to 7 (GitHub Pro includes 3,000 min/month). See README.
    timeout-minutes: 120
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    env:
      HF_DATASET: ${{ vars.HF_DATASET || secrets.HF_DATASET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FORCE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements-dev.txt

      - name: Pipeline tests (before touching any data)
        run: python -m pytest pipeline/tests -q

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Update data (check MEF, ingest new publications, push to Hugging Face, rebuild serving)
        id: update
        working-directory: pipeline
        env:
          YEARS: ${{ inputs.years }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}   # absolute links in RSS feeds and Telegram
          IGNORE_CADENCE: ${{ inputs.ignore_cadence }}
        run: >-
          python run.py update $([ "$FORCE" = true ] && echo --force)
          $([ "$IGNORE_CADENCE" = true ] && echo --ignore-cadence) ${YEARS:+--years $YEARS}

      # what QA checked, including the Consulta Amigable pages it compared against (also on failure)
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            data/serving/qa_report.json
            data/serving/qa_ca_*.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Decide whether to deploy
        id: plan
        run: |
          if [ "${{ steps.update.outputs.changed }}" = true ] || [ "$FORCE" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # A small commit per kept snapshot (weekly): a public log of what was ingested, and repo
      # activity that keeps GitHub from disabling this schedule after 60 idle days.
      - name: Record MEF publications in the repo
        if: steps.update.outputs.snapshot == 'true'
        continue-on-error: true
        run: |
          mkdir -p status
          cp data/lake/manifest.json status/mef-publicaciones.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/mef-publicaciones.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos: nueva publicación del MEF"
            git pull --rebase && git push
          fi

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.deploy == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build site
        if: steps.plan.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_TELEGRAM_CANAL: ${{ vars.TELEGRAM_CANAL_URL }}   # optional: link shown on /metodologia
        run: npm ci && npm run build

      # The built site in a real browser, with this run's data, before anyone sees it: ~115 checks
      # (municipality search, explanations, contracts, orders, prices, map, follow list, alerts, 375 px layout).
      # A failure stops the deploy and the previous version stays online. About 1 minute.
      - name: Browser checks
        if: steps.plan.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npx playwright-core install --with-deps --only-shell chromium
          sitio="$RUNNER_TEMP/sitio"
          mkdir -p "$sitio"
          if [ -n "$BASE_PATH" ]; then ln -s "$PWD/out" "$sitio$BASE_PATH"; else sitio="$PWD/out"; fi
          python3 -m http.server 8767 --bind 127.0.0.1 --directory "$sitio" > /dev/null 2>&1 &
          sleep 1
          E2E_BASE="http://127.0.0.1:8767${BASE_PATH}" node e2e/sitio.mjs

      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: apps/web/out

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
