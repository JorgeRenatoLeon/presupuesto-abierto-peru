name: CI

# Quality gates on every change. No MEF downloads here: the pipeline is tested on
# fixtures, and the site is built without data (empty states must render too).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - run: python -m pytest pipeline/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # Report only: a static export runs no server code, so a new advisory should not block
      # every change; it shows up here to be handled (0 known vulnerabilities as of Oct 2026).
      - name: Security audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
